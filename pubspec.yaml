# Working well on Flutter SDK 3.13.6

name: mina_s_application5
description: A new Flutter project.
version: 1.0.0+1
environment: 
  sdk: '>=2.12.0 <3.0.0'
dependencies: 
  flutter: 
    sdk: flutter
  flutter_localizations: 
    sdk: flutter
  flutter_bloc: ^8.1.3
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  equatable: ^2.0.5
  another_stepper: ^1.2.2
  calendar_date_picker2: ^0.5.3
  awesome_dialog: ^3.2.0
  syncfusion_flutter_calendar: 22.2.7
  intl: ^0.18.0
#  month_picker_dialog: 2.0.0
  pretty_dio_logger: ^1.3.1


  dio: ^5.4.0
dev_dependencies: 
  flutter_test: 
    sdk: flutter

  flutter_launcher_icons: ^0.13.1



#flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/launcher_icon/ic_launcher_foreground.png"
  image_path: "assets/images/launcher_icon/ic_launcher.png"
  min_sdk_android: 21 # android min sdk min:16, default 21


flutter: 
  uses-material-design: true
  assets: 
    - assets/
    - assets/images/
  fonts: 
    - family: Sulphur Point
      fonts: 
        - asset: assets/fonts/SulphurPointBold.ttf
          weight: 700
    - family: Stylish
      fonts: 
        - asset: assets/fonts/StylishRegular.ttf
          weight: 400
